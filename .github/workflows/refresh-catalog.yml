name: Refresh film catalog

on:
  schedule:
    # 06:00 UTC on the 1st of each month. The catalog moves slowly — a film
    # needs years to gather enough votes to qualify — so monthly is plenty.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Hoisted to the job so the deploy step can test it in its `if`. Neither
    # `secrets` nor a step's own `env` is readable from a step-level condition.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch catalog from TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: npm run catalog

      # Never commit a catalog the matcher can't work with. This is the step
      # that would have caught the all-blockbusters fetch.
      - name: Test the catalog against the matcher
        run: npm test

      - name: Commit if the catalog changed
        id: commit
        run: |
          if git diff --quiet data/films.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged — nothing to deploy."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/films.js
            git commit -m "Refresh film catalog from TMDB"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # With the repo connected to Vercel, the push above deploys on its own and
      # this step stays skipped. It is a fallback: set VERCEL_TOKEN as a secret
      # and it takes over, so a broken git connection can't silently leave the
      # site serving an old catalog.
      - name: Deploy to Vercel (only without the git integration)
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
