name: Refresh film catalog

on:
  schedule:
    # 06:00 UTC on the 1st of each month. The catalog moves slowly — a film
    # needs years to gather enough votes to qualify — so monthly is plenty.
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch catalog from TMDB
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: npm run catalog

      # Never commit a catalog the matcher can't work with. This is the step
      # that would have caught the all-blockbusters fetch.
      - name: Test the catalog against the matcher
        run: npm test

      - name: Commit if the catalog changed
        id: commit
        run: |
          if git diff --quiet data/films.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog unchanged — nothing to deploy."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/films.js
            git commit -m "Refresh film catalog from TMDB"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only needed while the Vercel project is CLI-deployed. If you connect the
      # repo to Vercel, the push above deploys on its own and this step is a
      # no-op — it skips itself when VERCEL_TOKEN isn't set.
      - name: Deploy to Vercel
        if: steps.commit.outputs.changed == 'true' && secrets.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
